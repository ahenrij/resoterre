preprocessing_command: |
  python scripts/preprocessing/downscaling_preprocessing_rdps_to_hrdps.py \
    configs/downscaling/downscaling_preprocessing_rdps_to_hrdps.yaml

# workflow and output paths
path_logs: /path/to/logs
path_output: /path/to/output/preprocessed  # Output for preprocessed batches

# input data paths
path_rdps: /path/to/RDPS                           # raw RDPS forecast files  {YYYYMMDDCC}_{FFF}.nc
path_rdps_regrid: /path/to/RDPS_regrid             # pre-regridded variable files (fast path)
path_rdps_climatology: /path/to/RDPS_climatology   # climatology files for anomaly variables
path_hrdps_mf: /path/to/HRDPS_regrid/HRDPS_MF_2km_north_america_ml.nc      # topography
path_hrdps_sftlf: /path/to/HRDPS_regrid/HRDPS_sftlf_2km_north_america_ml.nc  # land-sea mask
path_grids: /path/to/grids
path_hrdps: null
path_hrdps_climatology: null
path_hrdps_mask: null

# settings
random_seed: 0
max_save_count: null  # Used to limit the number of samples saved during data generation; null means no limit

# Dataset specifications
grid_input_for_ml: 8km_north_america_ml
grid_output_for_ml: 2km_north_america_ml
start_datetime: "2017-05-22 00:00:00"
end_datetime: "2024-05-30 18:00:00"
rdps_variables:
  - TT_model_levels
  - PR
  - UU_model_levels
  - VV_model_levels
  - HU850
  - GZ500
  - PC
  - PN
  - UU850
  - VV850
hrdps_variables:
  - HRDPS_P_TT_10000
  - HRDPS_P_PR_SFC
  - HRDPS_P_UUC_10000
  - HRDPS_P_VVC_10000

rdps_window_size: null  # e.g., 64 for 64x64 patches
overlap_factor: null  # preferably a divisor of rdps_window_size
hrdps_required_unmasked_fraction: null  # e.g., 0.8 means at least 80% of HRDPS pixels in the patch must be unmasked

temporal_window: null  # 1 means +/- 1 time step around the target time step
variables_with_temporal_context:
  - PR
  - HU850
  - PC
  - HRDPS_P_PR_SFC

anomaly_variables:
  - PN
  - GZ500
  - UU850
  - VV850

normalize: true

# Currently the test set will be taken from the end of the dataset, validation set from before that, and the rest is training set
# within each set, there is a partial random shuffling of samples (samples coming from the same file are together to minimize I/O)
train_fraction: 0.8
validation_fraction: 0.1
test_fraction: 0.1

save_batch_size: 16

# Additional metadata for stac extension
# Note that ideally this should be retrieved from the data files
hrdps_extent_coordinates:
  lat_min: 27.284586
  lat_max: 70.6115
  lon_min: -152.73064
  lon_max: -40.708557
hrdps_shape:
  rlat_size: 1290
  rlon_size: 2540
rdps_extent_coordinates:
  lat_min: -7.7491064
  lat_max: 89.96573
  lon_min: 0.00029021563
  lon_max: 359.9995
rdps_shape:
  rlat_size: 1076
  rlon_size: 1102
north_america_8km_grid_extent_coordinates:
  lat_min: 18.35
  lat_max: 79.55
  lon_min: -158.05
  lon_max: -35.41
north_america_8km_grid_shape:
  lat_size: 256
  lon_size: 512
north_america_2km_grid_extent_coordinates:
  lat_min: 18.26
  lat_max: 79.64
  lon_min: -158.14
  lon_max: -35.32
north_america_2km_grid_shape:
  rlat_size: 1024
  rlon_size: 2048

framework: pytorch
framework_version: '2.10.0+cu128'
